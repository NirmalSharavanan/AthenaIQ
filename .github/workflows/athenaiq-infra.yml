name: AthenaIQ Infra

# Creates or changes the AWS resources (S3 bucket, CloudFront). Run "plan" first, then "apply".
on:
  workflow_dispatch:
    inputs:
      action:
        type: choice
        default: plan
        options: [plan, apply, destroy]
      confirm:
        description: Only for destroy. Type DELETE-ATHENAIQ
        type: string
        default: ""

permissions:
  id-token: write
  contents: read

concurrency: athenaiq-infra

jobs:
  infra:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Only main may change AWS
        if: github.ref != 'refs/heads/main'
        run: echo "::error::Run this workflow from main." && exit 1
      - name: Sign in to AWS (OIDC, role athenaiq-github-infra)
        run: bash .github/scripts/aws-login.sh infra
      - name: Install OpenTofu
        run: |
          v=1.10.6
          curl -fsSL -o "/tmp/tofu_${v}_linux_amd64.zip" "https://github.com/opentofu/opentofu/releases/download/v$v/tofu_${v}_linux_amd64.zip"
          curl -fsSL -o /tmp/SHA256SUMS "https://github.com/opentofu/opentofu/releases/download/v$v/tofu_${v}_SHA256SUMS"
          (cd /tmp && grep "tofu_${v}_linux_amd64.zip" SHA256SUMS | sha256sum -c --quiet -)
          sudo unzip -oq "/tmp/tofu_${v}_linux_amd64.zip" tofu -d /usr/local/bin
      - name: Connect to state
        working-directory: deploy/aws/tofu
        run: |
          tofu init -input=false \
            -backend-config="bucket=$STATE_BUCKET" -backend-config="key=$ATHENAIQ_ENV/tofu.tfstate" \
            -backend-config="region=$AWS_REGION" -backend-config="encrypt=true" -backend-config="use_lockfile=true"
      - name: Plan
        if: inputs.action != 'destroy'
        working-directory: deploy/aws/tofu
        run: |
          tofu plan -input=false -var-file=../env/prod.tfvars -out=tfplan
          { echo '### Planned changes'; echo '```'; tofu show -no-color tfplan | grep -E '^(Plan:|No changes|  # )' || true; echo '```'; } >>"$GITHUB_STEP_SUMMARY"
      - name: Apply
        if: inputs.action == 'apply'
        working-directory: deploy/aws/tofu
        run: |
          tofu apply -input=false tfplan
          echo "### AthenaIQ address: $(tofu output -raw athenaiq_url)" >>"$GITHUB_STEP_SUMMARY"
          echo "Confirm the AWS budget/alert email, then run the AthenaIQ Deploy workflow." >>"$GITHUB_STEP_SUMMARY"
      - name: Destroy
        if: inputs.action == 'destroy'
        env:
          CONFIRM: ${{ inputs.confirm }}
        working-directory: deploy/aws/tofu
        run: |
          [ "$CONFIRM" = "DELETE-ATHENAIQ" ] || { echo "::error::Type DELETE-ATHENAIQ in confirm."; exit 1; }
          aws s3 rm --recursive --only-show-errors "s3://$SITE_BUCKET" || true
          tofu destroy -input=false -auto-approve -var-file=../env/prod.tfvars
